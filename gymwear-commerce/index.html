<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gymwear PRD Explorer</title>
<style>
:root{--bg:#f4f7fa;--panel:#ffffff;--panel2:#eef3f8;--text:#14243a;--muted:#5b6b80;--line:#d8e1ea;--accent:#1f5f8b;--accent-ink:#ffffff;--navy:#16304f;
--s-ns:#8a97a8;--s-ip:#c58a12;--s-im:#2f6fb5;--s-fv:#1f8a5b;--s-oa:#0f6b45;--s-bl:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1119;--panel:#121a25;--panel2:#18222f;--text:#e8eef5;--muted:#9aa9ba;--line:#273444;--accent:#5fa8dc;--accent-ink:#06121d;--navy:#0e1824;
--s-ns:#7d8a9b;--s-ip:#e0a63a;--s-im:#5c9be0;--s-fv:#3cc489;--s-oa:#2fae76;--s-bl:#e5604f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1119;--panel:#121a25;--panel2:#18222f;--text:#e8eef5;--muted:#9aa9ba;--line:#273444;--accent:#5fa8dc;--accent-ink:#06121d;--navy:#0e1824;
--s-ns:#7d8a9b;--s-ip:#e0a63a;--s-im:#5c9be0;--s-fv:#3cc489;--s-oa:#2fae76;--s-bl:#e5604f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--navy);color:#dfe8f2;padding:22px 18px}
.brand b{display:block;font-size:17px;letter-spacing:.02em}
.brand small{color:#9fb2c7}
nav{margin-top:18px}
nav button{display:block;width:100%;min-height:40px;border:0;background:transparent;color:#cfdbe8;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer}
nav button:hover,nav button[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.side-prog{margin-top:18px;padding:14px;border:1px solid rgba(255,255,255,.14);border-radius:12px}
.side-prog .lbl{font-size:12px;color:#9fb2c7;display:flex;justify-content:space-between}
.bar{height:8px;background:rgba(127,140,160,.3);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:#5fc59a;width:0}
.theme{margin-top:14px;width:100%;min-height:40px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#dfe8f2;border-radius:8px;cursor:pointer}
main{padding:30px 34px 60px;max-width:1240px;width:100%}
.page{display:none}.page.on{display:block}
h1{font-size:30px;margin:0 0 6px;line-height:1.2}
h2{font-size:21px;margin:28px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.lede{color:var(--muted);max-width:820px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:16px}
.card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.c4{grid-column:span 4}.c6{grid-column:span 6}.c3{grid-column:span 3}
.kpi{font-size:28px;font-weight:800}
.muted{color:var(--muted)}.tiny{font-size:12.5px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0;background:var(--panel2)}
.pill.ret{border-color:#2f6fb5;color:var(--s-im)}.pill.v1{border-color:#8a4fbf;color:#8a4fbf}.pill.x{border-color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.toolbar input,.toolbar select{min-height:42px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px}
.toolbar input{flex:1 1 220px}
.btn{min-height:42px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1[tabindex="-1"]:focus{outline:none}
.req{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--s-ns);border-radius:10px;margin:10px 0}
.req[data-s="ip"]{border-left-color:var(--s-ip)}.req[data-s="im"]{border-left-color:var(--s-im)}.req[data-s="fv"]{border-left-color:var(--s-fv)}.req[data-s="oa"]{border-left-color:var(--s-oa)}.req[data-s="bl"]{border-left-color:var(--s-bl)}
.req summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.req summary::-webkit-details-marker{display:none}
.req summary .id{font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-width:94px}
.req summary .t{flex:1 1 220px;font-weight:600}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.badge[data-s="ns"]{color:var(--s-ns)}.badge[data-s="ip"]{color:var(--s-ip)}.badge[data-s="im"]{color:var(--s-im)}.badge[data-s="fv"]{color:var(--s-fv)}.badge[data-s="oa"]{color:var(--s-oa)}.badge[data-s="bl"]{color:var(--s-bl)}
.req .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.req ul{margin:10px 0;padding-left:20px}.req li{margin:4px 0}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding:12px;background:var(--panel2);border-radius:8px}
.ledger label{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.ledger select,.ledger textarea,.ledger input{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px;min-height:40px}
.ledger textarea{min-height:64px;resize:vertical}
.ledger .full{grid-column:1/-1}
.blockedf{display:none}.ledger[data-s="bl"] .blockedf{display:block}
.warn{color:var(--s-bl);font-size:12.5px;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:13px}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.flow span{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:13px}
.flow b{color:var(--muted);font-weight:400}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.gate{margin:12px 0}
.gate h3{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.src li{margin:5px 0;word-break:break-word}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;padding:14px 16px}
 nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
 nav button{white-space:nowrap;width:auto}
 .side-prog{display:none}
 main{padding:20px 16px 50px}
 .c4,.c6,.c3{grid-column:span 12}
 .ledger{grid-template-columns:1fr}
 h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="app">
<aside>
 <div class="brand"><b>GYMWEAR COMMERCE</b><small>PRD v1.0 · 6 Oct 2026 · Explorer</small></div>
 <nav id="nav" aria-label="Sections"></nav>
 <div class="side-prog" aria-live="polite">
  <div class="lbl"><span>Retail certification</span><span id="sp-ret">0%</span></div><div class="bar"><i id="sb-ret"></i></div>
  <div class="lbl"><span>Full V1</span><span id="sp-v1">0%</span></div><div class="bar"><i id="sb-v1"></i></div>

 </div>
 <button class="theme" id="theme" type="button">Toggle light / dark</button>

<main id="main"></main>

<script>
/* ---------- PRD content (condensed from 01_PRODUCT_REQUIREMENTS v1.0) ---------- */
const STATUSES=[['ns','Not started'],['ip','In progress'],['im','Implemented'],['fv','Functionally verified'],['oa','Owner accepted'],['bl','Blocked']];
const DONE=new Set(['fv','oa']);
// milestone: ret = required for retail certification, v1 = additionally required for full V1, x = cross-cutting (required by both)
const REQS=[
{id:'CAT-01',t:'Catalog and publication',sec:'7. Retail',m:'ret',g:[1,2],src:[],
 s:'Every product and variant carries the commerce fields needed to sell it; publication goes through validation, not direct staff bypass.',
 r:['Product: stable ID, handle, title, original/authorized media, category, description, care info, fulfillment type, tax/shipping classification, published state, related size-chart version.',
 'Variant: own SKU, size, color, price, inventory policy, and weight where shipping needs it. Accessories may use an approved one-size chart type.',
 'Draft / published / archived products; manual and rule-based collections; badges tied to real states; scheduled merchandising.',
 'Publish validation rejects missing commerce fields and unresolved rights/size-chart approvals. Archived products leave purchase flows but stay identifiable on historical orders.',
 'No empty categories copied from the reference menu. Audit/unpublish invalid drift. A direct variant-ID request must not make an unapproved product purchasable.']},
{id:'CAT-02',t:'Search, filters, and sorting',sec:'7. Retail',m:'ret',g:[1,2],src:[],
 s:'Variant-aware search and faceting with URL-persisted state.',
 r:['Search titles, SKUs/style IDs, category names, approved attributes.','Facets: category, size family, size, color, price range, available-now, training/competition use, collection.',
 'AND across facets, OR within a facet. Red + size M must match a purchasable red/M variant, not red in one size and M in another.',
 'Sorts: relevance, price asc/desc, newest, merchant-featured. "Best selling" only with a documented real-order rule.',
 'Query, sort, page/cursor and facets live in the URL; selected chips, clear-all, result counts, useful no-results state.','Paginate without duplicates or gaps; never download the whole catalog to the browser.']},
{id:'PDP-01',t:'Product details and variants',sec:'7. Retail',m:'ret',g:[1],src:[],
 s:'Accurate, variant-driven product page with explicit size selection.',
 r:['Original photos with zoom and meaningful alt text; title, style/SKU, price and currency, chosen options, accurate stock, size help, care, shipping/production context, return classification.',
 'Price ranges resolve to the selected variant price. Selection updates image, URL, price, availability and add-to-cart eligibility together.',
 'Explicit size selection required; never silently pick the smallest size. Disable impossible combinations and explain sold-out states.',
 'Add-to-cart sends the real variant ID and quantity. Related products link to real published items. Review counts and stars only from approved real records.']},
{id:'FIT-01',t:'Size guidance',sec:'7. Retail',m:'ret',g:[1,2],src:['S2'],
 s:'Each product family points at an approved, versioned size chart; suggestions are deterministic and never guaranteed.',
 r:['Inches/centimeters from one canonical stored unit with consistent conversion; no double rounding.','Any size suggestion is deterministic, names its chart/version, explains ambiguous or missing inputs, and does not guarantee fit.',
 'V1 never saves body measurements to profiles or analytics; inputs are ephemeral to the sizing session.','Missing or unapproved charts block apparel publication. Never substitute GK sizing for another manufacturer.',
 'Order evidence keeps the chart version shown at purchase, stamped from trusted server/merchant records — not shopper-editable cart attributes.']},
{id:'WISH-01',t:'Wishlist',sec:'7. Retail',m:'ret',g:[2],src:[],
 s:'Device-local wishlist for guests, durable server wishlist for signed-in customers.',
 r:['Guests save product/variant IDs on device; store no private customer data there.','Merge guest and account items on login without duplicates and without touching another customer\'s list.','Removed/unavailable items stay labeled; remove and move-to-cart work for available items.']},
{id:'CART-01',t:'Cart persistence and correctness',sec:'7. Retail',m:'ret',g:[1],src:['S9'],
 s:'The cart reflects real provider mutations, not local component state.',
 r:['Persist across navigation and refresh with a protected session. Clear merge behavior when an account cart meets a guest cart; revalidate quantities and availability.',
 'Edits update provider-calculated costs, variants and discounts. A UI success must reflect a successful provider mutation.',
 'Explain that cart placement is not a stock reservation. Refresh price/availability before checkout; show what changed and require acceptance of current terms.',
 'Handle expired carts, deleted variants, API throttling, network loss and parallel-tab edits without silently losing the basket. Cart costs are estimates until checkout.']},
{id:'PAY-01',t:'Hosted checkout and payment',sec:'7. Retail',m:'ret',g:[1],src:['S8','S9'],
 s:'Shopify-hosted checkout via the real cart checkout URL; success requires verified provider state.',
 r:['Guest checkout and authenticated buyer association. Show only payment methods actually enabled; no decorative wallet buttons.',
 'Address, shipping, discounts, tax and payment are validated by the platform. The app may display estimates but never determines the charged amount.',
 'A return URL, query parameter or locally generated receipt is not payment proof.',
 'Handle declines, auth challenges, abandonment, pending payment, duplicate taps, outages and delayed confirmation. Never double-create an order on retry.',
 'Never log card data, customer-account tokens, full cart secrets or payment credentials.']},
{id:'INV-01',t:'Stock integrity',sec:'7. Retail',m:'ret',g:[1,4],src:['S16'],
 s:'Shopify is the only stock ledger; last-unit contention must be proven.',
 r:['Track stock per variant and location in Shopify. Disable "continue selling when out of stock" for ordinary stocked products.','Do not maintain a competing stock counter in the extension database.',
 'Release test: two buyers racing for the last unit — only the legitimately available quantity sells.','Ordinary carts never promise reservations. Quotes on stock-backed garments need a tested reservation or just-in-time policy with expiry/release; no custom line bypasses stock control.']},
{id:'SHIP-01',t:'Delivery and tax presentation',sec:'7. Retail',m:'ret',g:[2],src:['S4'],
 s:'Merchant-supplied shipping configuration; stocked and custom orders ship and pay separately.',
 r:['Merchant supplies origin, regions, rates/carrier, parcel data, cutoffs, holidays, thresholds. Never copy GK thresholds or durations.','Show processing/production estimates separately from carrier transit. Reject unsupported destinations before payment with a useful explanation.',
 'Stocked purchases and custom quote payments use separate checkout/order flows with explicit explanation and separate shipping totals; never silently duplicate fees or pool free-shipping thresholds.',
 'Taxes and discounts on each order are authoritative platform values. Legal/tax configuration needs owner approval.']},
{id:'ACCT-01',t:'Accounts and order access',sec:'7. Retail',m:'ret',g:[1,2],src:['S8'],
 s:'Shopify Customer Account auth; guest order access through a verified short-lived link or code.',
 r:['Sign-in, sign-out, session expiry/refresh and recovery without losing the intended destination. Approved HTTPS callback/origin settings.','Account pages show only that verified customer\'s orders and addresses; deep links reauthenticate and return safely.',
 'Guest access: short-lived verified email link/code, rate limits, non-enumerating responses. Order numbers are display IDs, not secrets.',
 'Expose order items, financial and fulfillment state, tracking, receipt access and support/return actions. Reorder rechecks variants, prices and stock.']},
{id:'RMA-01',t:'Returns, cancellation, exchanges, refunds',sec:'7. Retail',m:'ret',g:[1,2],src:['S5','S6','S17'],
 s:'One approved, versioned return policy enforced on every surface; approval is not a refund.',
 r:['Item-level requests with reason, quantity, policy version and status. Policy defines window, event basis, condition rules, final-sale/personalized exclusions, defects, return-shipping responsibility and refund destination.',
 'States: requested → reviewing → approved/rejected → in transit → received → inspected → refund pending/refunded → closed, with explicit exception handling.',
 'Inventory is not restored before inspection. Refunds respect line discounts, taxes, prior refunds and shipping rules; never exceed the refundable amount.',
 'Cancellation requests before release under policy; never guaranteed on submission. V1 exchanges = return/refund + new purchase at current stock/price.','Staff execute and verify financial actions in Shopify. Exceptions need authorized review and an audit entry.']},
{id:'COMMS-01',t:'Service, notifications, reviews, restock',sec:'7. Retail',m:'ret',g:[2,3],src:[],
 s:'Durable support tickets and real transactional notices. Reviews and restock subscriptions are full-V1 items.',
 r:['Contact forms create durable tickets: ID, acknowledgment, owner/assignee, status, reply path. Email failure must not discard a ticket.',
 'Transactional notices for verified order/payment, shipment, return decisions, refunds, quote issuance, proof changes and production milestones; one sender per message type.',
 '(Full V1) Consented, variant-specific restock subscriptions with verification, unsubscribe, send dedup and fresh inventory checks; a notice is not a stock guarantee.',
 '(Full V1) Verified-purchase reviews need an eligible fulfilled line, one active review per rule, moderation history, abuse controls and honest aggregates. No seeded reviews or invented counts.']},
{id:'TEAM-01',t:'Team workspaces and size grids',sec:'8. Team / custom',m:'v1',g:[3],src:[],
 s:'Merchant-approved organizations with explicit memberships and validated size/quantity grids.',
 r:['Named adult contacts and explicit memberships. Invitations expire, can\'t be replayed and grant only the specified role. Membership is never inferred from email domain.',
 'Editable size/quantity matrix: nonnegative whole quantities, total units, template minimums, available size ranges; row-level errors and explicit confirmation before saving.',
 'Import preview from the supplied template with row-level errors. Exports match approved quantities and prevent spreadsheet-formula injection.',
 'Optional roster labels; no children\'s full names required, no birthdates, body photos or health info. One payer and one shipping destination per team order in V1.']},
{id:'DESIGN-01',t:'Functional bounded 2D designer',sec:'8. Team / custom',m:'v1',g:[3],src:['S3'],
 s:'Real synchronized front/back preview over merchant templates, saved as structured versioned data.',
 r:['Merchant-approved front/back templates with named panels: permitted colors, fabric/trim options, allowed embellishment placements, text/logos within safe zones.',
 'Saved data: template version, panel choices, option IDs, placement coordinates, text, approved asset refs, pricing-rule version. Undo/redo, explicit save, reload, duplicate, revision.',
 'An accessible non-canvas form path reaches the same saved configuration.',
 'Uploads: PNG/JPEG only, ≤10 MB, MIME/signature check, dimension limits, re-encode, strip metadata, private storage. Reject executables, arbitrary SVG, invalid and decompression-bomb files. Rights attestation + staff review.',
 'Previews are illustrative. Estimates only from approved pricing rules, otherwise "Quote required". No browser-supplied price becomes a charged line.']},
{id:'QUOTE-01',t:'Quote, proof, versioning, payment',sec:'8. Team / custom',m:'v1',g:[3,4],src:['S10'],
 s:'Immutable quote revisions, recorded approvals, exactly one payable draft order per revision.',
 r:['Submission creates a durable request: design revision, size grid, required-by date, contact, destination, notes. Staff review manufacturability, minimums, stock inputs, pricing and timing; revised proofs, comments, approve/reject — not just an email.',
 'Issued quote is immutable: itemized prices and quantities, setup charges, currency, shipping/tax treatment, proof, lead-time assumptions, expiry, cancellation/return policy. Approval records who approved which revision and when; any material change requires a new revision.',
 'Exactly one Shopify draft-order/invoice per issued revision via a durable idempotent job, using supported GraphQL APIs and proven entitlements.',
 'Full payment through hosted invoice checkout; no deposit ledger. Personalized stock garments stay tied to inventory-backed variants.',
 'Superseded/rejected/expired quotes lose their payment path (tested provider-side invalidation). Payment racing expiry → visible paid-exception hold. Never "mark paid" in place of real payment.']},
{id:'PROD-01',t:'Production, fulfillment, reorder',sec:'8. Team / custom',m:'v1',g:[3],src:[],
 s:'Production starts only after exact proof approval, confirmed payment and capacity checks.',
 r:['States: awaiting approval → awaiting payment → ready to schedule → scheduled → in production → quality review → ready to ship → shipped → closed. Exception/on-hold/canceled need reasons and authorized transitions.',
 'Each job links commerce order, quote revision, approved proof, size grid, due-date estimate, responsible staff and event history. Customer-safe status never exposes internal cost or other teams\' data.',
 'Production pack: approved front/back proof, configuration IDs, quantities by size, instructions, order reference — a work instruction, not a certified cutting pattern.',
 'Reorder duplicates the configuration into a new draft requiring current pricing, template compatibility and capacity approval.']},
{id:'ADMIN-01',t:'Commerce administration',sec:'9. Merchant ops',m:'ret',g:[1,2,3],src:[],
 s:'Shopify Admin is the system of record; an embedded Custom Work app covers teams, quotes and production.',
 r:['Shopify Admin owns catalog, variants, inventory, pricing, discounts, customers, financial orders, fulfillment, refunds. No second payment dashboard that can disagree.',
 'Embedded app: organizations, design review, quote/proof revisions, production queues, service cases, integration health.',
 'Required actions: create/edit/archive product; validate and publish; import with preview and error report; adjust stock with reason; manage collections and size charts; configure promotions; view/filter paid orders; record shipment and tracking; process authorized return/refund; approve a team; issue/revise/void quote; update production; inspect failed notifications or sync jobs.']},
{id:'CMS-01',t:'Content and configuration',sec:'9. Merchant ops',m:'ret',g:[2],src:[],
 s:'Merchant-editable content with separate draft/preview/publish.',
 r:['Navigation, homepage collections/banners, size/fit help, care, FAQs, support contacts, shipping/return/privacy/terms policies, brand tokens, announcement bar.',
 'Legal and financial rule changes need owner permission and version history.','Scheduled promotions use an explicit timezone and show consistent state across storefront and checkout.']},
{id:'OPS-01',t:'Operational truth',sec:'9. Merchant ops',m:'ret',g:[2],src:[],
 s:'Actionable admin counts with documented calculations; never fabricated health.',
 r:['Landing view: unfulfilled paid orders, low stock, pending team approvals, quotes awaiting action, production due/overdue, return cases, failed integration jobs.',
 'Each metric has a documented calculation and last-update timestamp. Missing connections show "Pending connection" or "Unavailable".',
 'Native tools count only when the exact tool, access role, verified action and evidence are identified; included in operator training and acceptance evidence.']},
{id:'ARC-01',t:'Managed commerce, custom experience',sec:'10. Architecture',m:'x',g:[0],src:['S7'],
 s:'Default: Hydrogen + TypeScript storefront on Oxygen, Shopify APIs, hosted checkout, embedded admin app, managed Postgres, private object storage, durable worker.',
 r:['Storefront API for products/cart; Customer Account API for identity; Shopify-hosted checkout; Shopify Admin + custom embedded app for operations.',
 'Host embedded app, database, storage and worker on an approved managed service. Don\'t run long jobs or incompatible DB drivers on the storefront edge. Record host, worker runtime, backup service and email provider in the foundation phase.',
 'Existing-system safeguard: inventory any existing store/repo first; changing commerce backend needs a written decision, migration/reconciliation plan and the same acceptance coverage.',
 'Cost/entitlement gate: confirm plan eligibility, seats, headless access, API scopes, app deployment, shipping/tax, fees, email, DB/storage and monitoring costs. Do not assume native B2B features.']},
{id:'ARC-02',t:'Authority and data boundaries',sec:'10. Architecture',m:'x',g:[0],src:[],
 s:'Shopify owns money, stock and orders; the extension DB owns teams, designs, quotes and production.',
 r:['See the Architecture page for the full authority table.','Extension may read/cache commerce data but never keeps a competing writeable ledger or synthesizes paid state.']},
{id:'ARC-03',t:'Integration reliability',sec:'10. Architecture',m:'x',g:[2,4],src:['S11','S12'],
 s:'Verified webhooks, durable inbox, idempotent processing, transactional outbox, reconciliation.',
 r:['Verify webhook signatures on raw bodies. Durably record before acknowledging; process idempotently tracking event ID, topic, resource ID, attempts, state and error.',
 'Webhooks may duplicate, delay, go missing or arrive out of order: keep resource-version checks and periodic reconciliation.',
 'Transactional outbox for app side effects; retries never create a second invoice, refund, job or message. On ambiguous results, look up the correlation ID first.',
 'Exhausted retries go to a visible dead-letter queue with safe manual replay.','Reconcile orders, refunds, fulfillment, inventory projections and quote links every 15 min (configurable); record last success and alert on repeated failure. Stale projections never overwrite newer state.']},
{id:'DATA-01',t:'Required extension entities',sec:'11. Data',m:'x',g:[0,2,3],src:[],
 s:'Stable internal IDs, provider IDs kept separate, UTC timestamps, exact money, immutable approved revisions.',
 r:['Rows carry created/updated timestamps and revision/optimistic-lock info. Money as exact decimals or integer minor units with currency.',
 'Identity: customer_refs, organizations, memberships, invitations, staff_permissions.','Customer tools: wishlists, wishlist_items, restock_subscriptions, review_eligibility/reviews, consent_events, support_tickets and messages (unique constraints prevent duplicates).',
 'Custom work: design_templates, template_versions, design_drafts, design_versions, private_assets, size_grids, quote_requests, quotes, quote_revisions, quote_items, approval_events, provider_order_links, production_jobs, production_events.',
 'Operations: return_cases, return_case_items, notification_jobs, webhook_inbox, outbox_jobs, reconciliation_runs, audit_events, policy_versions.',

 const filt=()=>{const q=p.querySelector('#q').value.toLowerCase().trim(),m=p.querySelector('#fm').value,s=p.querySelector('#fs').value;let n=0;
  REQS.forEach(r=>{const hay=(r.id+' '+r.t+' '+r.s+' '+r.r.join(' ')).toLowerCase();
   const ok=(!q||hay.includes(q))&&(!m||r.m===m)&&(!s||R(r.id).s===s);document.getElementById('r-'+r.id).hidden=!ok;if(ok)n++});
  let e=list.querySelector('.empty');if(!n&&!e){e=document.createElement('div');e.className='empty';e.textContent='No requirements match these filters.';list.appendChild(e)}else if(n&&e)e.remove()};
 ['q','fm','fs'].forEach(i=>p.querySelector('#'+i).addEventListener('input',filt));
 p.querySelector('#expand').onclick=e=>{const open=e.target.textContent==='Expand all';list.querySelectorAll('details').forEach(d=>d.open=open);e.target.textContent=open?'Collapse all':'Expand all'};
 const exbox=p.querySelector('#exbox'),exout=p.querySelector('#exout');
 const show=(name,type,data)=>{exbox.hidden=false;p.querySelector('#exname').textContent=name;exout.value=data;p.querySelector('#exmsg').textContent='';dl(name,type,data)};
 p.querySelector('#excopy').onclick=()=>{const m=p.querySelector('#exmsg');const fb=()=>{exout.select();m.textContent='Selected. Press Ctrl+C or Cmd+C to copy.'};
  try{navigator.clipboard.writeText(exout.value).then(()=>m.textContent='Copied.',fb)}catch(e){fb()}};
 p.querySelector('#exclose').onclick=()=>exbox.hidden=true;
 const lmsg=t=>{const m=p.querySelector('#lmsg');m.textContent=t;m.hidden=!t};
 p.querySelector('#exjson').onclick=()=>show('gymwear-requirements-ledger.json','application/json',JSON.stringify({prd:'Gymwear Commerce PRD v1.0',exported:new Date().toISOString(),...st},null,2));
 p.querySelector('#excsv').onclick=()=>{const cell=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const rows=[['ID','Title','Milestone','Gates','Status','Owner','Dependency','Safe work','Evidence','Notes']].concat(REQS.map(r=>{const L=R(r.id);return[r.id,r.t,mLabel[r.m],r.g.join(' '),sName(L.s),L.owner,L.dep,L.safe,L.missing,L.notes]}));
  show('gymwear-requirements-ledger.csv','text/csv',rows.map(x=>x.map(cell).join(',')).join('\r\n'))};
 p.querySelector('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);
  st={reqs:j.reqs||{},gates:j.gates||{},demos:j.demos||{},decisions:j.decisions||{}};
  Object.values(st.reqs).forEach(L=>{if(!STATUSES.some(x=>x[0]===L.s))L.s='ns'});save();renderAll();go('reqs')}catch(err){lmsg('That file is not a valid ledger export. Choose a JSON file made with Export ledger.')}})};
 const rb=p.querySelector('#reset');let armed=0;rb.onclick=()=>{if(!armed){armed=1;rb.textContent='Click again to clear everything';lmsg('This clears every status, note, gate check and decision saved in this browser.');setTimeout(()=>{if(armed){armed=0;rb.textContent='Reset ledger';lmsg('')}},6000);return}
  st={reqs:{},gates:{},demos:{},decisions:{}};save();renderAll();go('reqs')};
}
function checkWarn(d,id){const L=R(id),w=d.querySelector('[data-warn]');let msg='';
 if(L.s==='bl'&&!(L.dep&&L.owner&&L.safe&&L.missing))msg='A blocked item has to name its dependency, owner, safe available work and missing evidence (HANDOFF-01).';
 else if(DONE.has(L.s)&&!L.missing)msg='Record the evidence: test IDs or run links on the release environment. Screenshots or mock adapter success do not count.';
 w.textContent=msg;w.hidden=!msg}
function dl(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<td><b>${esc(c)}</b></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

function renderStatic(){
 document.getElementById('p-users').innerHTML=`<h1>Users, permissions and journeys</h1><p class="lede">PRD § 4. Every privileged write records actor, timestamp, target and change.</p>
 <div class="grid">${ROLES.map(([t,d])=>`<div class="card c6"><h3>${t}</h3><p class="muted">${esc(d)}</p></div>`).join('')}</div>
 <h2>Primary journeys</h2>${JOURNEYS.map(([n,...s])=>`<div class="card" style="margin:10px 0"><h3>${n} journey</h3><div class="flow">${s.map((x,i)=>`${i?'<b aria-hidden="true">→</b>':''}<span>${esc(x)}</span>`).join('')}</div></div>`).join('')}`;
 document.getElementById('p-screens').innerHTML=`<h1>Screens and interaction contract</h1><p class="lede">PRD § 5–6. Shopify-hosted checkout and merchant admin are intended system boundaries, not broken navigation or unfinished screens.</p>
 ${table(['Surface','Routes / destination','Mandatory behavior'],SCREENS)}
 <h2>Universal interaction contract</h2><div class="card"><ul>
 <li>Each route defines loading, ready, empty, error, permission-denied and unavailable-service states where applicable.</li>
 <li>Each form defines validation, a submission lock, durable proof of success and a retry path. Dialogs manage keyboard focus and have a visible close control.</li>
 <li>Every navigation element has a working destination. No production link may resolve to localhost, the owner's own computer, or a retired preview.</li></ul></div>
 <h2>Visual and interaction requirements</h2><div class="grid">
 <div class="card c6"><h3>Direction</h3><p class="muted">Premium athletic retail: product-first imagery, clean light surfaces, strong readable type, restrained accents, clear hierarchy. Original direction, not a GK copy. Use a neutral test identity with configurable color, type and logo tokens until the owner supplies a brand kit.</p></div>
 <div class="card c6"><h3>Layout</h3><p class="muted">Two product cards per row at ~390px when readable (one if accessibility settings require); 3–4 columns on wider screens. Filters go in a mobile sheet and a desktop sidebar or toolbar. Restore scroll position and filters after visiting a product.</p></div>
 <div class="card c6"><h3>Product detail</h3><p class="muted">On desktop the gallery sits beside the purchase controls; on mobile it stacks. A sticky purchase bar is allowed only if it hides nothing important. Size help sits next to size selection. Labels state availability plainly: "Ready to ship", "Custom quote required", "Out of stock".</p></div>
 <div class="card c6"><h3>Interaction</h3><p class="muted">44×44px touch targets, visible focus, non-color state indicators, real alt text, reduced motion, no autoplay audio. No carousel-only navigation, hover-only information, forced install prompts, fake scarcity or countdowns that no real schedule backs.</p></div>
 <div class="card"><h3>Design delivery</h3><p class="muted">Before any screen is built, define tokens, type scale, spacing, breakpoints, inputs, buttons, cards, menus, drawers, alerts, tables and status badges. Deliver mobile and desktop designs for the storefront, product page, cart, account order detail, designer, quote detail and merchant queue. Visual approval does not replace functional testing.</p></div></div>`;
 document.getElementById('p-arch').innerHTML=`<h1>Architecture and data</h1><p class="lede">PRD § 10–11. This is the recommended default; it is not a claim that GK uses the same stack. It also assumes paid plans: confirm costs and entitlements before committing to it.</p>
 <div class="card"><h3>Default reference implementation</h3><div class="flow"><span>Hydrogen + TypeScript on Oxygen</span><span>Storefront API</span><span>Customer Account API</span><span>Shopify-hosted checkout</span><span>Shopify Admin</span><span>Embedded Custom Work app</span><span>Managed PostgreSQL</span><span>Private object storage</span><span>Durable background worker</span></div></div>
 <h2>Authority and data boundaries (ARC-02)</h2>${table(['Domain','Authoritative system','Extension behavior'],AUTH)}
 <h2>Application operations (API-01)</h2>${table(['Operation group','Required contract','Essential checks'],APIS)}
 <h2>Integration reliability (ARC-03)</h2><div class="card"><div class="flow"><span>Verify signature on raw body</span><b>→</b><span>Durably record in webhook_inbox</span><b>→</b><span>Acknowledge</span><b>→</b><span>Process idempotently (version check)</span><b>→</b><span>Retry with backoff</span><b>→</b><span>Dead-letter + safe replay</span></div>
 <p class="muted">App-originated side effects go through a transactional outbox, so a retry never creates a second invoice, refund, production job or message. Reconciliation runs every 15 minutes (configurable); a stale projection never overwrites newer commerce state.</p></div>`;
 document.getElementById('p-sources').innerHTML=`<h1>Scope, exclusions and sources</h1>
 <div class="grid"><div class="card c6"><h3>Build defaults (not owner facts)</h3><p class="muted">One merchant. Direct-to-consumer sales plus approved adult team buyers. English, responsive web, USD. Contiguous-US shipping profile. Stocked leotards plus quoted customization. One fulfillment location. Installable PWA, not app-store binaries.</p></div>
 <div class="card c6"><h3>Explicitly outside V1</h3><p class="muted">3D garment simulation, AR fitting, AI fit guarantees, native app-store apps, subscriptions, gift cards, loyalty, marketplace sellers, international tax/duties, tax-exempt wholesale accounts, net terms, deposits/installments, athlete profiles, public customer photos, split family payments, unrestricted artwork-to-manufacturing automation.</p></div>
 <div class="card"><h3>No surprise purchasing</h3><p class="muted">The PRD does not authorize opening paid accounts, buying domains, upgrading plans, buying shipping labels or charging cards. Development uses approved test services. Live payment activation and any live transaction need explicit owner authorization.</p></div>
 <div class="card"><h3>Content boundary</h3><p class="muted">Use only original or properly authorized branding, photography, copy, logos, fonts, team marks and product data. Do not import GK reviews, endorsements, licensed collections, inventory, pricing, photos or artwork. Do not imply a GK partnership or scrape the reference site for inventory.</p></div></div>
 <h2>Source register (consulted 6 Oct 2026)</h2><ol class="src">${Object.entries(SOURCES).map(([k,[t,u]])=>`<li>[${k}] ${esc(t)}: <a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a></li>`).join('')}</ol>`;
}

function renderGates(){
 const p=document.getElementById('p-gates');
 p.innerHTML=`<h1>Gates and definition of done</h1><p class="lede">BUILD-01 execution sequence. Gate checkboxes are progress notes only. They do not stand in for acceptance-register evidence.</p>
 ${GATES.map(([t,items],gi)=>{const done=items.filter((_,i)=>st.gates[gi+'.'+i]).length;
  return `<div class="card gate"><h3><span>${t}</span><span class="muted tiny">${done}/${items.length}</span></h3>
  <div class="tiny muted">Requirements sequenced here: ${REQS.filter(r=>r.g.includes(gi)).map(r=>`<a href="#reqs" data-jump="${r.id}">${r.id}</a>`).join(', ')}</div>
  ${items.map((x,i)=>`<label class="check"><input type="checkbox" data-g="${gi}.${i}"${st.gates[gi+'.'+i]?' checked':''}><span>${esc(x)}</span></label>`).join('')}</div>`}).join('')}
 <h2>Release acceptance (§ 16)</h2>
 ${DEMOS.map(([t,d],i)=>`<div class="card gate"><label class="check"><input type="checkbox" data-d="${i}"${st.demos[i]?' checked':''}><span><b>${t}</b><br><span class="muted">${esc(d)}</span></span></label></div>`).join('')}
 <div class="note"><b>Final rule:</b> No release is "complete" while an included customer or operator path ends at a decorative button, a fake success message, an unconnected integration, or an undocumented manual workaround.</div>`;
 p.querySelectorAll('[data-g]').forEach(c=>c.onchange=()=>{st.gates[c.dataset.g]=c.checked;save();
  const card=c.closest('.gate'),boxes=card.querySelectorAll('[data-g]');card.querySelector('h3 .muted').textContent=[...boxes].filter(b=>b.checked).length+'/'+boxes.length});
 p.querySelectorAll('[data-d]').forEach(c=>c.onchange=()=>{st.demos[c.dataset.d]=c.checked;save()});
 p.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();go('reqs');const d=document.getElementById('r-'+a.dataset.jump);d.hidden=false;d.open=true;d.scrollIntoView({block:'start'})});
}

function renderLaunch(){
 const p=document.getElementById('p-launch');
 p.innerHTML=`<h1>Launch decisions and blockers</h1><p class="lede">PRD § 15. These owner inputs were not supplied. Work proceeds on reversible test defaults, but none of these facts may be invented, and the storefront may not be presented as ready to transact until each gate closes. Silence never counts as approval.</p>
 <div class="tablewrap"><table><thead><tr><th scope="col">Decision</th><th scope="col">Development default</th><th scope="col">Production gate</th><th scope="col">Owner decision / evidence</th><th scope="col">Closed</th></tr></thead><tbody>
 ${DECISIONS.map(([a,b,c],i)=>{const D=st.decisions[i]||{};return `<tr><td><b>${esc(a)}</b></td><td>${esc(b)}</td><td>${esc(c)}</td>
 <td><label for="dn-${i}" style="position:absolute;left:-9999px">Evidence for ${esc(a)}</label><textarea id="dn-${i}" data-dn="${i}" rows="2" style="width:100%;min-width:180px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px">${esc(D.note)}</textarea></td>
 <td><input type="checkbox" aria-label="${esc(a)} closed" data-dc="${i}"${D.closed?' checked':''} style="width:20px;height:20px"></td></tr>`}).join('')}
 </tbody></table></div>
 <p id="dmsg" class="warn" role="status" hidden></p>
 <div class="note" style="margin-top:14px">Missing branding does not block API work. Missing live keys do not justify fake payment code. Missing manufacturing data does not justify promising production-ready customization. Label test content clearly and keep the blocked ledger up to date.</div>`;
 const D=i=>st.decisions[i]||(st.decisions[i]={note:'',closed:false});
 p.querySelectorAll('[data-dn]').forEach(t=>t.oninput=()=>{D(t.dataset.dn).note=t.value;save()});
 p.querySelectorAll('[data-dc]').forEach(c=>c.onchange=()=>{const d=D(c.dataset.dc);const m=p.querySelector('#dmsg');if(c.checked&&!d.note.trim()){m.textContent='Write the owner decision or evidence for "'+DECISIONS[c.dataset.dc][0]+'" before closing it.';m.hidden=false;c.checked=false;return}m.hidden=true;d.closed=c.checked;save()});
}

function renderAll(){renderReqs();renderStatic();renderGates();renderLaunch();renderOverview();refreshProgress()}
renderAll();
const start=(location.hash||'#overview').slice(1);go(PAGES.some(x=>x[0]===start)?start:'overview');

/* theme */
document.getElementById('theme').onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(KEY+'-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem(KEY+'-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
